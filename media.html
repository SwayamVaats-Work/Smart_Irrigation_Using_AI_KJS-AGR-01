<!DOCTYPE html>
<html>
<head>
  <title>Farmer Irrigation Advisory</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
    }

    video {
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      margin-top: 15px;
    }

    .offer-box {
      width: 65%;
      margin: 25px auto;
      padding: 20px;
      background-color: #fff3cd; 
      color: #b7791f;
      font-size: 22px; 
      font-weight: bold;
      border: 2px dashed #f39c12;
      border-radius: 10px;
      text-shadow: 1px 1px 2px #d68910; 
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.5); 
      
      animation: pulseGlow 1.5s infinite alternate;
    }

    .offer-box p {
      margin: 6px 0;
      font-size: 16px;
      font-weight: normal;
      color: #795548;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 5px #f39c12;
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 22px #e67e22, 0 0 35px #f39c12;
        transform: scale(1.02);
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0;">

  <header style="background-color: #156b51; padding: 20px; border-bottom: 4px solid #e67e22;">
            <h1 style="color: #ecf0f1; text-align: center; margin: 0;">Smart Irrigation & Water Conservation Advisory</h1>
        </header>

  <div class="offer-box">
    📢 SPECIAL SCHEME: 50% Subsidy on Drip Irrigation Kits!
    <p>Apply before the end of the season at your local Taluka Agriculture Office.</p>
  </div>

  <video controls autoplay loop width="600">
    <source src="Images and videos/Water_Irrigation_Tips.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    alert("Welcome to the Irrigation Advisory System");
  </script>

  <footer>

    <br>
    <a href="mailto:swayam.vaats@somaiya.edu">swayam.vaats@somaiya.edu</a>
  </footer>

</body>
</html>
